services:
  company_structure_postgres:
    image: postgres:18.4-bookworm
    container_name:  company_structure-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  company_structure_migrate:
    image: migrate/migrate:v4.19.1
    volumes: 
      - ${PROJECT_ROOT}/migrations:/migrations

  company_structure_migrate-goose:
    image: kukymbr/goose-docker:3.27.1
    entrypoint: ["goose"]
    volumes: 
      - ${PROJECT_ROOT}/migrations:/migrations
    working_dir: /migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@company_structure_postgres:5432/${POSTGRES_DB}?sslmode=disable"

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: company_structure-postgres-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:company_structure_postgres:5432
    ports:
      - "127.0.0.1:5434:5432"