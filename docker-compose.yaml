services:
  company_structure_postgres:
    image: postgres:18.4-bookworm
    container_name:  company_structure-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  company_structure_migrate:
    image: migrate/migrate:v4.19.1
    volumes: 
      - ${PROJECT_ROOT}/migrations:/migrations
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: company_structure-postgres-forwarder
    comand: tcp-listen:5432,fork,reuseadr tcp-connect:company_structure_postgres:5432
    ports:
      - "127.0.0.0.1:5432:5432"